<section class="section section-soft">
  <div class="section-container">


    <!-- TÍTULO -->
    <header class="section-header">
      <tittle-section text="Contacto" />

    </header>

    <!-- CONTENT -->
    <div class="grid grid-cols-1 lg:grid-cols-[1.2fr_0.8fr] gap-12 ">

      <!-- FORM -->
      <form
        [formGroup]="form"
        (ngSubmit)="enviar()"
        class="rounded-[18px] border border-white/25 bg-white/20 backdrop-blur-[10px] p-4 shadow-[0_12px_30px_rgba(20,30,80,0.10)]
                p-6 md:p-10 lg:p-12"
      >
        <div class="space-y-6 md:space-y-8">

          <!-- NOMBRE -->
          <div>
            <label
              class="block text-sm md:text-base font-medium text-gray-700
                     mb-1 md:mb-2"
            >
              Nombre y apellido
            </label>

            <input
              type="text"
              formControlName="nombre"
              placeholder="Ej. Ana García"
              class="w-full rounded-xl border border-violet-300
                     px-4 md:px-5
                     py-2.5 md:py-3
                     text-sm md:text-base
                     placeholder-gray-400 placeholder-opacity-70
                     focus:outline-none focus:border-violet-500
                     focus:ring-2 focus:ring-violet-400"
            />
          </div>

          <!-- MENSAJE -->
          <div>
            <label
              class="block text-sm md:text-base font-medium text-gray-700
                     mb-1 md:mb-2"
            >
              Mensaje
            </label>

            <textarea
              rows="4"
              formControlName="mensaje"
              placeholder="Cuéntame brevemente en qué puedo ayudarte..."
              class="w-full rounded-xl border border-violet-300
                     px-4 md:px-5
                     py-2.5 md:py-3
                     text-sm md:text-base
                     placeholder-gray-400 placeholder-opacity-70
                     focus:outline-none focus:border-violet-500
                     focus:ring-2 focus:ring-violet-400
                     resize-none"
            ></textarea>
          </div>

          <!-- BOTÓN -->
          <button
            type="submit"
            [disabled]="form.invalid"
            class="w-full bg-violet-500 text-white
                   py-3 md:py-4
                   rounded-xl
                   text-sm md:text-base
                   font-semibold shadow-lg
                   hover:bg-violet-600 hover:shadow-xl transition
                   disabled:opacity-50"
          >
            ➤ Enviar mensaje
          </button>

          <!-- TEXTO -->
          <p
            class="text-xs md:text-sm text-gray-500
                   text-center leading-relaxed"
          >
            Toda comunicación es estrictamente confidencial y profesional. <br />
            Tu espacio seguro comienza aquí.
          </p>

        </div>
      </form>

      <!-- INFO -->
      <div class="flex flex-col space-y-6">

        <!-- CARD INSTAGRAM -->
        <div
          class="
                rounded-[18px] border border-white/25 bg-white/20 backdrop-blur-[10px] p-4 shadow-[0_12px_30px_rgba(20,30,80,0.10)]
                p-6
                border border-white-100"
        >
          <div class="flex items-center gap-4">
            <img
              src="/images/profile.png"
              alt="Instagram"
              class="w-14 h-14 rounded-full object-cover"
            />
            <div>
              <p class="font-semibold text-gray-900">
                Matías Bohé
              </p>
              <a
                href="https://www.instagram.com/psi.matiasbohe/"
                target="_blank"
                class="text-sm text-violet-600 hover:underline"
              >
                @psi.matiasbohe
              </a>
            </div>
          </div>

          <p class="text-sm text-gray-600 mt-3">
            Psicólogo · Atención presencial y online · Espacio seguro
          </p>

          <a
            href="https://www.instagram.com/psi.matiasbohe/"
            target="_blank"
            class="inline-block mt-4 text-sm font-semibold
                   text-violet-600 hover:underline"
          >
            Ver perfil en Instagram →
          </a>
        </div>

        <!-- CARD UBICACIÓN -->
        <div
          class="rounded-[18px] border border-white/25 bg-white/30 backdrop-blur-[10px] p-4 shadow-[0_12px_30px_rgba(20,30,80,0.10)] p-6
           border border-white-100"
        >
          <h3 class="font-semibold text-gray-900 text-sm md:text-base mb-3">
            Ubicación
          </h3>

          <div
            class="w-full h-48 md:h-56 rounded-xl
                   overflow-hidden border border-gray-200"
          >
            <iframe
              class="w-full h-full"
              loading="lazy"
              referrerpolicy="no-referrer-when-downgrade"
              src="https://www.google.com/maps?q=Zona+Centro+Rosario+Santa+Fe+Argentina&output=embed"
            ></iframe>
          </div>

          <p class="text-xs md:text-sm text-gray-600 mt-4 leading-relaxed">
            📍 Zona Centro<br />
            Atención presencial y online
          </p>
        </div>

      </div>

    </div>

  </div>
</section>
