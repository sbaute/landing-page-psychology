<div class="section-header">

    viewBox="0 0 120 10"
    fill="none"
  >
    <line
      x1="120"
      y1="5"
      x2="10"
      y2="5"
      stroke="currentColor"
      stroke-width="1.5"
      opacity="0.6"
    />

      points="14,1 10,5 14,9"

      stroke="currentColor"

  <!-- Flecha derecha -->
  <svg
    class="section-arrow right"
    viewBox="0 0 120 10"
    fill="none"
  >
    <line
      x1="0"
      y1="5"
      x2="110"
      y2="5"

      stroke-width="1.5"
      opacity="0.6"
    />

      points="106,1 110,5 106,9"
      fill="none"
      stroke="currentColor"

      opacity="0.6"
