<section
  class="relative min-h-screen bg-cover bg-bottom bg-no-repeat"
  style="background-image: url('/images/fondo-animacion.jpg.jpeg');"
>

  <!-- Overlay -->
  <div class="absolute inset-0 bg-white/40"></div>

  <!-- Contenido -->
    <div
    class="absolute
           top-1/2 left-25
           -translate-y-1/2
           z-20
           max-w-xl
           w-full
           px-10"
  >
    <div class="flex flex-col items-start text-left gap-8">

    <!-- Columna izquierda -->
    <div class="max-w-xl flex flex-col gap-8">

      <!-- Título -->
        <h1
          class="font-serif
                text-5xl sm:text-6xl lg:text-7xl
                leading-tight
                text-left"
        >
          <span class="block font-semibold text-slate-800">
            Acompañamiento psicológico
          </span>

          <span class="relative inline-block font-medium text-slate-600 text-4xl sm:text-5xl lg:text-6xl">
            para sentirte mejor

            <!-- Pincelada SVG -->
            <svg
              class="absolute left-0 -bottom-3 w-full -z-10"
              viewBox="0 0 400 30"
              preserveAspectRatio="none"
            >
              <path
                d="M5 20 Q 80 5 150 15 T 290 15
                  Q 300 28 150 24 T 5 20 Z"
                fill="#C4B5FD"
                opacity="0.6"
              />
            </svg>
          </span>
        </h1>

        <!-- Subtexto -->
       <p
        class="text-slate-600
              text-sm sm:text-lg
              lg:text-xl
              leading-relaxed
              font-light
              max-w-lg
              text-left"
      >
        Un espacio seguro para escucharte y acompañarte,
        trabajando juntos en tu bienestar emocional
        con respeto por tus tiempos y tu proceso.
      </p>


        <!-- Botón  CTA-->
      <div class="animate-fade-in-up delay-900 ml-3">
        <a
          routerLink="/"
          fragment="contacto"
          aria-label="Agendá una consulta"
          class="button-home group relative overflow-hidden
                rounded-full bg-gradient-to-r from-violet-500 to-purple-600
                hover:from-violet-600 hover:to-purple-700
                transition-all duration-300
                md:hover:scale-105
                shadow-lg shadow-violet-500/30 hover:shadow-xl"
        >
          <span class="relative z-10">Agendá tu primera sesión</span>

          <div
            class="absolute inset-0 bg-white/20
                  transform -skew-x-12 -translate-x-full
                  group-hover:translate-x-full
                  transition-transform duration-700"
          ></div>

          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-5 h-5 relative z-10
                  transition-transform duration-300
                  group-hover:translate-x-1"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="m18 8l4 4m0 0l-4 4m4-4H2" />
          </svg>
        </a>
      </div>

      </div>


    </div>

  </div>

</section>
