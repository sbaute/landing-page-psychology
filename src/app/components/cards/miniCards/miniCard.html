<div
  class="
    group
    rounded-[18px]
    border border-white/25
    bg-white/10
    backdrop-blur-[10px]
    p-4
    shadow-[0_12px_30px_rgba(20,30,80,0.10)]
    transition-all duration-300
    hover:-translate-y-1
    hover:shadow-[0_18px_55px_rgba(20,30,80,0.18)]
    hover:bg-white/15
    h-40
    sm:h-[170px]
    flex
  "
>
  <div class="flex flex-col items-center gap-3 w-full">
    <div
      class="
        w-11 h-11 rounded-full
        bg-white/40
        border border-white/25
        flex items-center justify-center
        shadow-sm
        transition-all duration-300
        group-hover:bg-white/55
        shrink-0
      "
    >
      <span class="text-xl">{{ icon() }}</span>
    </div>

    <div class="flex flex-col items-center ">
      <h3 class="font-semibold text-lg text-slate-900 leading-tight">
        {{ title() }}
      </h3>

      <p class="mt-1 text-base text-slate-700/90 leading-snug text-center">
        {{ description() }}
      </p>
    </div>
  </div>
</div>
