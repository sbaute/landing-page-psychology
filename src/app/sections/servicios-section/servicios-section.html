<section class="section section-soft">
  <div class="section-container">

    <!-- encabezado -->
      <header class="section-header">
        <tittle-section text="Servicios" />
      </header>

     <div class="grid grid-cols-1 md:grid-cols-2 gap-12">
      @for (service of services(); track service.title) {
        <card-information-service
          [title]="service.title"
          [image]="service.image"
          [items]="service.items"
        />
      }

   <div class="col-span-full flex justify-center">
      <a
        href="#contacto"
        class="
           group relative inline-flex items-center justify-center gap-2
            rounded-full px-6 py-3
            md:px-10 md:py-4

            font-serif text-lg
            md:text-xl

            text-[#2C2B78]

            bg-white/25
            border border-white/50
            backdrop-blur-xl

            shadow-[0_20px_60px_rgba(76,58,160,0.18)]
            transition-all duration-300 ease-out

            hover:-translate-y-1
            hover:shadow-[0_28px_80px_rgba(76,58,160,0.28)]
            hover:border-white/70

            active:translate-y-0
            active:scale-[0.99]
            active:shadow-[0_18px_45px_rgba(76,58,160,0.16)]

            focus:outline-none
            focus-visible:ring-2
            focus-visible:ring-[#B85CFF]/50
        "
      >
        <!-- brillo suave que aparece en hover -->
        <span
          class="
            pointer-events-none absolute inset-0 rounded-full
            opacity-0 transition-opacity duration-300
            group-hover:opacity-100
            bg-gradient-to-r from-white/0 via-white/30 to-white/0
          "
        ></span>

       <span class="text-lg md:text-2xl">
        Agendá tu sesión
      </span>


        <svg
          class="
            relative h-5 w-5
            transition-all duration-300 ease-out
            group-hover:translate-x-1
            text-[#6B4EFF]
          "
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
        </svg>
      </a>
    </div>





    </div>






  </div>
</section>
